# Development PostgreSQL Database Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Church_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret & Expiration
app.jwt.secret=${JWT_SECRET:ChurchManagementSecretKeySuperLong256BitMinimumLengthHereForSecurity}
app.jwt.expiration-ms=86400000
